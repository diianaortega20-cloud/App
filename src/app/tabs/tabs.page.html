<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button *ngIf="isAdmin" tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="triangle"></ion-icon>
      <ion-label>Usuarios</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="person-circle"></ion-icon>
      <ion-label>Mi perfil</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="square"></ion-icon>
      <ion-label>Gestión</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="origenes" href="/tabs/origenes">
      <ion-icon aria-hidden="true" name="server-outline"></ion-icon>
      <ion-label>Orígenes</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
